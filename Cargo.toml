[package]
name = "droidm"
version = "0.1.0"
edition = "2021"
authors = ["Venuka Silva"]
description = "Android Cockpit - Developer ADB telemetry and management cockpit written in Rust and Tauri"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
